[workspace]
resolver = "2"
members = [
    "crates/sage_core",
    "crates/sage_collision",
    "crates/sage_script",
    "crates/sage_ecs_py",
    "crates/sage_platform",
    "crates/sage_assets",
    "crates/sage_scene",
    "crates/sage_ui",
    "crates/sage_editor",
    "tools/shaderc",
    "examples/pong",
    "examples/ui_demo",
    "examples/ui_playground",
    "examples/editor",
    "spikes/flecs_features",
    "spikes/pyo3_cost",
]
default-members = [
    "crates/sage_core",
    "crates/sage_collision",
    "crates/sage_script",
    "crates/sage_ecs_py",
    "crates/sage_platform",
    "crates/sage_assets",
    "crates/sage_scene",
    "crates/sage_ui",
    "crates/sage_editor",
    "tools/shaderc",
    "examples/pong",
    "examples/ui_demo",
    "examples/ui_playground",
    "examples/editor",
    "spikes/flecs_features",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
# License is [Open] (design doc 15); no license is granted yet.

# Every external dependency is pinned exactly. See docs/dependencies.md for
# licenses and why each one is here.
[workspace.dependencies]
# Default features: a reduced set fails to compile (pregenerated bindings reference the alerts addon). See docs/spikes/S1.md.
flecs_ecs = { version = "=0.2.2" }
pyo3 = { version = "=0.30.1" }
# Static build of the vendored SDL 3.4.20 (needs CMake and a C compiler). See docs/spikes/S5.md.
sdl3 = { version = "=0.22.1", features = ["build-from-source-static"] }
parry2d = { version = "=0.31.1" }
# PNG decoding only (M1 asset pipeline). MIT OR Apache-2.0.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# Approved by Morgan 2026-11-11 (UI parity plan, decision 4 and 1). All MIT OR Apache-2.0 (fontdue also Zlib; puremp3 MIT OR CC0-1.0).
roxmltree = { version = "=0.21.2" }
accesskit = { version = "=0.25.2" }
# Windows UI Automation adapter (approved 2026-11-11: the Windows one only).
accesskit_windows = { version = "=0.35.2" }
fontdue = { version = "=0.9.5" }
rustybuzz = { version = "=0.20.1" }
unicode-segmentation = { version = "=1.13.3" }
lewton = { version = "=0.10.2" }
puremp3 = { version = "=0.1.0" }

sage_core = { path = "crates/sage_core" }
sage_collision = { path = "crates/sage_collision" }
sage_script = { path = "crates/sage_script" }
sage_ecs_py = { path = "crates/sage_ecs_py" }
sage_platform = { path = "crates/sage_platform" }
sage_assets = { path = "crates/sage_assets" }
sage_scene = { path = "crates/sage_scene" }
sage_ui = { path = "crates/sage_ui" }
sage_editor = { path = "crates/sage_editor" }

[profile.dev]
# Flecs's C code and the Python interpreter are slow unoptimized; keep our own
# code debuggable but optimize dependencies.
[profile.dev.package."*"]
opt-level = 2
# The hot paths of a UI application (layout, interaction, drawing, the Python
# binding, the editor core) are optimized in dev builds too: unoptimized they
# made the editor feel sluggish under `cargo run`.
[profile.dev.package.sage_ui]
opt-level = 2
[profile.dev.package.sage_platform]
opt-level = 2
[profile.dev.package.sage_assets]
opt-level = 2
[profile.dev.package.sage_ecs_py]
opt-level = 2
[profile.dev.package.sage_editor]
opt-level = 2
[profile.dev.package.sage_core]
opt-level = 2
[profile.dev.package.sage_scene]
opt-level = 2
